<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Huruf A-Z & Angka 1-9 TK A</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #ff5400 0%, #3a0ca3 45%, #10002b 100%);
            background-size: 200% 200%;
            animation: galaxyShift 15s ease infinite alternate;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Poppins', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes galaxyShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .game-container {
            background: rgba(26, 2, 63, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 0 #7209b7, 0 15px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 520px;
            width: 100%;
            position: relative;
        }

        h1 {
            color: #ffd166;
            font-size: 1.4rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #000;
        }

        .question-box {
            background: linear-gradient(135deg, #480ca8, #3a0ca3);
            border: 3px solid #ffb703;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }

        .game-emoji {
            font-size: 40px;
            margin-bottom: 3px;
            letter-spacing: 3px;
            word-break: break-all;
        }

        .instruction-sub {
            font-size: 0.8rem;
            color: #ffd166;
            margin: 0;
            font-weight: bold;
        }

        .answer-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .word-display {
            display: flex;
            gap: 4px;
            align-items: center;
            background: rgba(16, 0, 43, 0.6);
            padding: 8px 10px;
            border-radius: 10px;
            border: 2px dashed #4cc9f0;
            overflow-x: auto;
            max-width: 330px;
        }

        .target-slot {
            width: 30px;
            height: 30px;
            background-color: #ffffff;
            color: #d32f2f;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            border: 2px solid #ff5400;
        }

        .static-letter {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .number-box-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number-label {
            font-size: 9px;
            color: #ffd166;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .number-slot {
            width: 34px;
            height: 34px;
            background-color: #ffffff;
            color: #3a0ca3;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            border: 2px solid #4cc9f0;
        }

        .virtual-keyboard {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .keyboard-section {
            background: rgba(16, 0, 43, 0.7);
            border: 2px solid #7209b7;
            border-radius: 12px;
            padding: 8px;
        }

        .section-title {
            font-size: 10px;
            color: #4cc9f0;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .letters-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .key-btn {
            background-color: #ff5400;
            color: white;
            border: 1px solid #fff;
            font-size: 10px;
            font-weight: bold;
            width: 23px;
            height: 23px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .key-btn:hover {
            background-color: #ff9f1c;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .num-btn {
            background-color: #4cc9f0;
            color: #10002b;
            border: 1px solid #fff;
            font-size: 13px;
            font-weight: bold;
            width: 26px;
            height: 26px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .num-btn:hover {
            background-color: #3a86ff;
            color: #fff;
        }

        .feedback {
            font-size: 0.95rem;
            font-weight: bold;
            height: 22px;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px #000;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #ffd166;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000;
        }

        .back-btn:hover {
            color: #fff;
        }

        /* POP-UP SUKSES & MINIGAME */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .popup-card {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 20px;
            border: 5px solid #ffb703;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            position: relative;
        }

        .popup-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #10002b;
            margin-bottom: 10px;
        }

        /* POP-UP KHUSUS JAWABAN SALAH */
        .wrong-popup-card {
            background: #fff3e0;
            border: 5px solid #ff5400;
        }

        .wrong-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 8px;
        }

        .wrong-desc {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        /* Tombol Tutup Cepat untuk Pop-up Salah */
        .close-wrong-btn {
            background-color: #ff5400;
            color: white;
            border: 2px solid #fff;
            padding: 6px 16px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 3px 0 #b33600;
        }

        .close-wrong-btn:hover {
            background-color: #ff9f1c;
        }

        .interactive-firework-area {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 110px;
            background: #fff9c4;
            border: 2px dashed #ffb703;
            border-radius: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .firework-item {
            font-size: 45px;
            user-select: none;
        }

        .firework-item.shake {
            animation: shakeFirework 0.2s ease-in-out infinite;
        }

        @keyframes shakeFirework {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 3px) rotate(-5deg); }
            50% { transform: translate(3px, -3px) rotate(5deg); }
            75% { transform: translate(-2px, -2px) rotate(-3deg); }
            100% { transform: translate(2px, 2px) rotate(3deg); }
        }

        .match-item {
            font-size: 40px;
            cursor: grab;
            user-select: none;
            touch-action: none;
            -webkit-user-drag: none;
            transition: transform 0.1s;
        }

        .match-item:active {
            cursor: grabbing;
        }

        /* EFEK LEDAKAN MEMANTUL FULLSCREEN */
        #fullscreen-fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
            overflow: hidden;
        }

        .fs-spark {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 2rem;
            animation: bounceEdgeAnim 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes bounceEdgeAnim {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 1;
            }
            60% {
                transform: translate(var(--fdx), var(--fdy)) scale(2.2);
                opacity: 1;
            }
            80% {
                transform: translate(calc(var(--fdx) * 0.85), calc(var(--fdy) * 0.85)) scale(1.8);
                opacity: 0.9;
            }
            100% {
                transform: translate(calc(var(--fdx) * 0.9), calc(var(--fdy) * 0.9)) scale(1.2);
                opacity: 0;
            }
        }

        .falling-star {
            position: absolute;
            top: -50px;
            font-size: 1.8rem;
            animation: starFallAnim linear forwards;
        }

        @keyframes starFallAnim {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🌟 Belajar Huruf A-Z & Angka 1-9 🎈</h1>
        
        <div class="question-box">
            <div id="game-image" class="game-emoji">🍎🍎</div>
            <p class="instruction-sub">Lengkapi huruf depan & tulis jumlah angkanya!</p>
        </div>

        <div class="answer-area">
            <div id="word-display" class="word-display"></div>

            <div class="number-box-wrapper">
                <span class="number-label">Jumlah</span>
                <div id="number-slot" class="number-slot">?</div>
            </div>
        </div>

        <div class="virtual-keyboard">
            <div class="keyboard-section">
                <div class="section-title">Pilih Huruf</div>
                <div id="letters-grid" class="letters-grid"></div>
            </div>

            <div class="keyboard-section">
                <div class="section-title">Pilih Angka</div>
                <div id="numbers-grid" class="numbers-grid"></div>
            </div>
        </div>

        <div id="feedback" class="feedback"></div>

        <a href="index.html" class="back-btn">⬅ Kembali ke Portal Utama</a>
    </div>

    <!-- Pop-up Sukses Minigame Seret Korek -->
    <div id="result-popup" class="popup-overlay">
        <div class="popup-card">
            <div id="popup-title" class="popup-title">🎉 Pintar! Seret korek ke mercon!</div>
            
            <div id="firework-area" class="interactive-firework-area">
                <div id="match-box" class="match-item" title="Seret korek ke mercon!">🔥</div>
                <div id="firework-target" class="firework-item">🧨</div>
            </div>
        </div>
    </div>

    <!-- Pop-up Khusus Jawaban Salah (Durasi 10 Detik + Tombol Lanjut) -->
    <div id="wrong-popup" class="popup-overlay">
        <div class="popup-card wrong-popup-card">
            <div class="wrong-title">💪 Belum Tepat, Yuk Perhatikan Lagi!</div>
            <div id="wrong-message" class="wrong-desc">Penjelasan kesalahan...</div>
            <button id="close-wrong-btn" class="close-wrong-btn">Lanjut Soal ➡️</button>
        </div>
    </div>

    <!-- Layer Fullscreen Ledakan Memantul & Bintang Jatuh -->
    <div id="fullscreen-fireworks"></div>

    <script>
        const akuratLearningData = [
            { baseEmoji: "🍎", name: "APEL" },        // A
            { baseEmoji: "⚽", name: "BOLA" },        // B
            { baseEmoji: "🦎", name: "CICAK" },      // C
            { baseEmoji: "🐑", name: "DOMBA" },      // D
            { baseEmoji: "🦅", name: "ELANG" },      // E
            { baseEmoji: "📸", name: "FOTO" },       // F
            { baseEmoji: "🐘", name: "GAJAH" },      // G
            { baseEmoji: "🐅", name: "HARIMAU" },    // H
            { baseEmoji: "🐟", name: "IKAN" },       // I
            { baseEmoji: "🍊", name: "JERUK" },      // J
            { baseEmoji: "🐱", name: "KUCING" },     // K
            { baseEmoji: "🐝", name: "LEBAH" },      // L
            { baseEmoji: "🐒", name: "MONYET" },     // M
            { baseEmoji: "🍍", name: "NANAS" },      // N
            { baseEmoji: "🪛", name: "OBENG" },      // O
            { baseEmoji: "🐼", name: "PANDA" },      // P
            { baseEmoji: "📖", name: "QURAN" },      // Q
            { baseEmoji: "🚀", name: "ROKET" },      // R
            { baseEmoji: "🐮", name: "SAPI" },       // S
            { baseEmoji: "🍅", name: "TOMAT" },      // T
            { baseEmoji: "🐫", name: "UNTA" },       // U
            { baseEmoji: "🎥", name: "VIDEO" },      // V
            { baseEmoji: "🥕", name: "WORTEL" },     // W
            { baseEmoji: "🩻", name: "X SINAR" },    // X
            { baseEmoji: "🪀", name: "YOYO" },       // Y
            { baseEmoji: "🦓", name: "ZEBRA" }       // Z
        ];

        let currentItem = {};
        let currentCount = 1;
        let userLetterInput = "";
        let userNumberInput = "";
        let wrongTimer = null; // Menyimpan timer pop-up salah

        const gameImage = document.getElementById("game-image");
        const wordDisplay = document.getElementById("word-display");
        const numberSlot = document.getElementById("number-slot");
        const lettersGrid = document.getElementById("letters-grid");
        const numbersGrid = document.getElementById("numbers-grid");
        const feedback = document.getElementById("feedback");

        const resultPopup = document.getElementById("result-popup");
        const popupTitle = document.getElementById("popup-title");
        const fireworkTarget = document.getElementById("firework-target");
        const matchBox = document.getElementById("match-box");
        
        const wrongPopup = document.getElementById("wrong-popup");
        const wrongMessage = document.getElementById("wrong-message");
        const closeWrongBtn = document.getElementById("close-wrong-btn");
        
        const fullscreenFireworks = document.getElementById("fullscreen-fireworks");

        function loadNewQuestion() {
            feedback.textContent = "";
            userLetterInput = "";
            userNumberInput = "";
            numberSlot.textContent = "?";
            numberSlot.style.color = "#3a0ca3";

            currentItem = akuratLearningData[Math.floor(Math.random() * akuratLearningData.length)];
            currentCount = Math.floor(Math.random() * 9) + 1;

            let emojis = "";
            for (let i = 0; i < currentCount; i++) {
                emojis += currentItem.baseEmoji;
            }
            gameImage.textContent = emojis;

            wordDisplay.innerHTML = "";
            const firstLetterSlot = document.createElement("div");
            firstLetterSlot.classList.add("target-slot");
            firstLetterSlot.id = "letter-slot-box";
            firstLetterSlot.textContent = "_";
            wordDisplay.appendChild(firstLetterSlot);

            for (let i = 1; i < currentItem.name.length; i++) {
                const span = document.createElement("span");
                span.classList.add("static-letter");
                span.textContent = currentItem.name[i];
                wordDisplay.appendChild(span);
            }
        }

        function setupLettersKeyboard() {
            lettersGrid.innerHTML = "";
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let char of alphabet) {
                const btn = document.createElement("button");
                btn.textContent = char;
                btn.classList.add("key-btn");
                btn.onclick = () => selectLetter(char);
                lettersGrid.appendChild(btn);
            }
        }

        function setupNumbersKeyboard() {
            numbersGrid.innerHTML = "";
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                btn.classList.add("num-btn");
                btn.onclick = () => selectNumber(i.toString());
                numbersGrid.appendChild(btn);
            }
        }

        function selectLetter(char) {
            userLetterInput = char;
            document.getElementById("letter-slot-box").textContent = char;
            checkComplete();
        }

        function selectNumber(num) {
            userNumberInput = num;
            numberSlot.textContent = num;
            numberSlot.style.color = "#d32f2f";
            checkComplete();
        }

        let isDragging = false;
        
        function initDragAndDrop() {
            fireworkTarget.style.display = "inline-block";
            fireworkTarget.classList.remove("shake");
            matchBox.style.display = "inline-block";
            matchBox.style.transform = "translate(0px, 0px)";
            popupTitle.textContent = "🎉 Pintar! Seret korek ke mercon!";

            matchBox.oncontextmenu = (e) => e.preventDefault();

            matchBox.onpointerdown = (e) => {
                isDragging = true;
                matchBox.setPointerCapture(e.pointerId);
                e.preventDefault();
            };

            matchBox.onpointermove = (e) => {
                if (!isDragging) return;
                const rect = matchBox.parentElement.getBoundingClientRect();
                const x = e.clientX - rect.left - 40;
                const y = e.clientY - rect.top - 40;
                matchBox.style.transform = `translate(${x}px, ${y}px)`;

                const matchRect = matchBox.getBoundingClientRect();
                const targetRect = fireworkTarget.getBoundingClientRect();
                
                const distance = Math.hypot(
                    (matchRect.x + matchRect.width/2) - (targetRect.x + targetRect.width/2),
                    (matchRect.y + matchRect.height/2) - (targetRect.y + targetRect.height/2)
                );

                if (distance < 70) {
                    fireworkTarget.classList.add("shake");
                } else {
                    fireworkTarget.classList.remove("shake");
                }
            };

            matchBox.onpointerup = (e) => {
                if (!isDragging) return;
                isDragging = false;
                matchBox.releasePointerCapture(e.pointerId);

                const matchRect = matchBox.getBoundingClientRect();
                const targetRect = fireworkTarget.getBoundingClientRect();
                
                const distance = Math.hypot(
                    (matchRect.x + matchRect.width/2) - (targetRect.x + targetRect.width/2),
                    (matchRect.y + matchRect.height/2) - (targetRect.y + targetRect.height/2)
                );

                if (distance < 70) {
                    triggerFullscreenBouncingExplosionAndStarfall();
                } else {
                    matchBox.style.transform = "translate(0px, 0px)";
                    fireworkTarget.classList.remove("shake");
                }
            };
        }

        function triggerFullscreenBouncingExplosionAndStarfall() {
            resultPopup.classList.remove("show");
            matchBox.style.display = "none";
            fireworkTarget.style.display = "none";

            fullscreenFireworks.style.display = "block";
            fullscreenFireworks.innerHTML = "";

            const explosionSymbols = ['✨', '🎆', '🎇', '💥', '🔥', '⭐'];
            for (let i = 0; i < 45; i++) {
                const spark = document.createElement("div");
                spark.classList.add("fs-spark");
                spark.textContent = explosionSymbols[Math.floor(Math.random() * explosionSymbols.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const distance = window.innerWidth * 0.45 + Math.random() * (window.innerWidth * 0.25);
                const fdx = Math.cos(angle) * distance;
                const fdy = Math.sin(angle) * distance;
                
                spark.style.setProperty('--fdx', `${fdx}px`);
                spark.style.setProperty('--fdy', `${fdy}px`);
                spark.style.animationDuration = (0.7 + Math.random() * 0.3) + 's';
                fullscreenFireworks.appendChild(spark);
            }

            setTimeout(() => {
                fullscreenFireworks.innerHTML = "";

                const starSymbols = ['⭐', '🌟', '✨', '💫'];
                for (let i = 0; i < 45; i++) {
                    const star = document.createElement("div");
                    star.classList.add("falling-star");
                    star.textContent = starSymbols[Math.floor(Math.random() * starSymbols.length)];
                    
                    star.style.left = Math.random() * 100 + 'vw';
                    star.style.animationDuration = (1.0 + Math.random() * 1.2) + 's';
                    star.style.animationDelay = (Math.random() * 0.5) + 's';
                    star.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
                    
                    fullscreenFireworks.appendChild(star);
                }
            }, 700);

            setTimeout(() => {
                fullscreenFireworks.style.display = "none";
                fullscreenFireworks.innerHTML = "";
                loadNewQuestion();
            }, 2700);
        }

        // Fungsi Menampilkan Pop-up Salah selama 10 Detik
        function showWrongPopup(letterWrong, numberWrong) {
            let msg = "";
            const correctLetter = currentItem.name[0];
            const correctNumber = currentCount.toString();

            if (letterWrong && numberWrong) {
                msg = `Huruf depan yang benar adalah <b>${correctLetter}</b> (bukan ${userLetterInput}), dan jumlah benda yang benar adalah <b>${correctNumber}</b> (bukan ${userNumberInput}). Yuk perhatikan lagi!`;
            } else if (letterWrong) {
                msg = `Huruf depan untuk kata <b>${currentItem.name}</b> yang benar adalah huruf <b>${correctLetter}</b>, bukan ${userLetterInput}.`;
            } else if (numberWrong) {
                msg = `Jumlah objeknya ada <b>${correctNumber}</b> (kamu memilih ${userNumberInput}). Yuk hitung ulang dengan teliti!`;
            }

            wrongMessage.innerHTML = msg;
            wrongPopup.classList.add("show");

            // Bersihkan timer lama jika ada
            if (wrongTimer) clearTimeout(wrongTimer);

            // Set waktu tunggu selama 10 detik (10000 ms) sebelum otomatis lanjut
            wrongTimer = setTimeout(() => {
                closeWrongPopupAndNext();
            }, 10000);
        }

        function closeWrongPopupAndNext() {
            if (wrongTimer) clearTimeout(wrongTimer);
            wrongPopup.classList.remove("show");
            loadNewQuestion();
        }

        // Tombol manual jika anak/orang tua ingin langsung lanjut tanpa menunggu 10 detik
        closeWrongBtn.onclick = () => {
            closeWrongPopupAndNext();
        };

        function checkComplete() {
            if (userLetterInput !== "" && userNumberInput !== "") {
                const correctLetter = currentItem.name[0];
                const correctNumber = currentCount.toString();

                const isLetterWrong = userLetterInput !== correctLetter;
                const isNumberWrong = userNumberInput !== correctNumber;

                if (!isLetterWrong && !isNumberWrong) {
                    resultPopup.classList.add("show");
                    initDragAndDrop();
                } else {
                    showWrongPopup(isLetterWrong, isNumberWrong);
                }
            }
        }

        setupLettersKeyboard();
        setupNumbersKeyboard();
        loadNewQuestion();
    </script>
</body>
</html>
